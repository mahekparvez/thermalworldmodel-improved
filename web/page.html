<title>Motor Thermal World Model &middot; Validation Console</title>

<style>
:root {
  --ground: #090e13;
  --panel: #0f161e;
  --panel-2: #141d27;
  --rule: #1d2a35;
  --ink: #e9eff5;
  --dim: #7d8f9f;
  --dimmer: #4e5e6d;
  --steel: #62a3c4;
  --steel-soft: #16303e;
  --alarm: #ffffff;

  --t0: #2e62c8; --t1: #28a8ce; --t2: #5cbf7a;
  --t3: #e8b03a; --t4: #eb6e32; --t5: #d62e2e;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 18px; --s5: 26px; --s6: 40px;
}

@media (prefers-color-scheme: light) {
  :root {
    --ground: #eaeef2; --panel: #ffffff; --panel-2: #f3f6f9;
    --rule: #ccd7df; --ink: #0c141c; --dim: #55697a; --dimmer: #8b9dab;
    --steel: #1f6f96; --steel-soft: #d9e9f1; --alarm: #0c141c;
  }
}
:root[data-theme="light"] {
  --ground: #eaeef2; --panel: #ffffff; --panel-2: #f3f6f9;
  --rule: #ccd7df; --ink: #0c141c; --dim: #55697a; --dimmer: #8b9dab;
  --steel: #1f6f96; --steel-soft: #d9e9f1; --alarm: #0c141c;
}
:root[data-theme="dark"] {
  --ground: #090e13; --panel: #0f161e; --panel-2: #141d27;
  --rule: #1d2a35; --ink: #e9eff5; --dim: #7d8f9f; --dimmer: #4e5e6d;
  --steel: #62a3c4; --steel-soft: #16303e; --alarm: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--dim);
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */

.console { display: grid; grid-template-rows: auto 1fr; height: 100vh; min-height: 560px; }

.bar {
  display: flex; flex-direction: column; gap: var(--s3);
  padding: var(--s3) var(--s4);
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.ident { display: flex; flex-direction: column; gap: 2px; }
.ident h1 { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 600;
  letter-spacing: .04em; }
.ident p { margin: 0; font-size: 11.5px; color: var(--dim); }

.controls {
  display: grid;
  grid-template-columns: minmax(180px, 240px) auto auto 1fr;
  gap: var(--s3) var(--s5);
  align-items: end;
}
.pick { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.seg button {
  appearance: none; background: transparent; border: 0;
  border-right: 1px solid var(--rule); color: var(--dim);
  font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
  padding: 6px 11px; cursor: pointer; white-space: nowrap;
  transition: background .12s, color .12s;
}
.seg button:last-child { border-right: 0; }
.seg button:hover:not(:disabled) { background: var(--panel-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--steel-soft); color: var(--steel); }
:is(button, select, [tabindex]):focus-visible { outline: 2px solid var(--steel); outline-offset: 1px; }

.jsel {
  width: 100%; appearance: none; background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px; padding: 6px 9px;
  font-family: var(--mono); font-size: 11px;
}
.verdictchip {
  justify-self: end; display: flex; align-items: baseline; gap: 9px;
  border: 1px solid var(--rule); padding: 5px 11px; white-space: nowrap;
}
.verdictchip .v { font-family: var(--mono); font-size: 15px;
  font-variant-numeric: tabular-nums; }

/* ---------- body split ---------- */

.split { display: grid; grid-template-columns: 1fr 6px var(--rail, 400px); min-height: 0; }
.grip { cursor: col-resize; background: var(--rule); position: relative;
  border: 0; padding: 0; appearance: none; }
.grip::after { content: ""; position: absolute; inset: 0 -4px; }
.grip:hover, .grip:focus-visible, .grip[data-drag="true"] { background: var(--steel); }
body[data-resizing="true"] { cursor: col-resize; user-select: none; }

.stage { position: relative; min-width: 0; overflow: hidden; background:
  radial-gradient(ellipse 70% 60% at 50% 38%, var(--panel-2) 0%, var(--ground) 78%); }
#view { display: block; width: 100%; height: 100%; }
#view .gl { stroke: var(--rule); stroke-width: 1; }
#view .ax { fill: var(--dimmer); font-family: var(--mono); font-size: 9.5px; }
#view .axl { fill: var(--dim); font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .11em; text-transform: uppercase; }
#view .cur { stroke: var(--ink); stroke-width: 1; opacity: .45; stroke-dasharray: 2 3; }

.hud { position: absolute; pointer-events: none; }
.key {
  left: var(--s4); top: var(--s4);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--rule); padding: var(--s2) var(--s3) 10px;
  min-width: 214px; max-width: calc(60% - var(--s4));
}
.keyrow { display: flex; align-items: center; gap: 8px; margin-top: 5px;
  font-family: var(--mono); font-size: 10.5px; }
.keyrow i { width: 16px; height: 0; flex: none; border-top-width: 2.5px; border-top-style: solid; }
.keyrow span:last-child { margin-left: auto; color: var(--dim);
  font-variant-numeric: tabular-nums; padding-left: 10px; }

.stat {
  right: var(--s4); top: var(--s4);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--rule); padding: var(--s2) var(--s3) 10px;
  min-width: 158px; max-width: calc(40% - var(--s4));
}
.stat dl { margin: 5px 0 0; display: grid; grid-template-columns: 1fr auto;
  gap: 3px 12px; font-family: var(--mono); font-size: 11px; }
.stat dt { color: var(--dim); }
.stat dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

.probe {
  background: var(--panel); border: 1px solid var(--rule); padding: 9px 11px;
  min-width: 198px; font-family: var(--mono); font-size: 11px;
  box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 5;
}
.probe .pn { font-size: 11.5px; letter-spacing: .03em; margin-bottom: 6px;
  padding-bottom: 5px; border-bottom: 1px solid var(--rule); }
.probe dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.probe dt { color: var(--dim); }
.probe dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- rail ---------- */

.rail { background: var(--panel); border-left: 1px solid var(--rule);
  display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.rtabs { display: flex; border-bottom: 1px solid var(--rule); }
.rtabs button {
  flex: 1; min-width: 0; appearance: none; background: transparent; border: 0;
  border-bottom: 2px solid transparent; color: var(--dim);
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; padding: 11px 2px; cursor: pointer;
}
.rtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--steel); }
.pane { overflow-y: auto; padding: var(--s4); display: none; }
.pane[data-open="true"] { display: block; }

.head { margin-bottom: var(--s4); }
.head h2 { margin: 0 0 2px; font-family: var(--mono); font-size: 13px;
  font-weight: 600; letter-spacing: .03em; }
.head .sub { color: var(--dim); font-size: 11.5px; }

h3.sec { font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--dim); margin: var(--s5) 0 var(--s2);
  padding-bottom: 5px; border-bottom: 1px solid var(--rule); }
h3.sec:first-child { margin-top: 0; }
.pane p { font-size: 12.5px; margin: 0 0 var(--s3); max-width: 62ch; }
.pane ul { margin: 0 0 var(--s3); padding-left: 17px; font-size: 12.5px; }
.pane li { margin-bottom: 5px; }

.note { border-left: 2px solid var(--rule); padding: 2px 0 2px 11px;
  margin-bottom: var(--s3); font-size: 12.5px; }
.note.key { border-left-color: var(--steel); }
.note.warn { border-left-color: var(--t3); }
.note.bad { border-left-color: var(--t5); }
.note b { font-weight: 600; }

.bigstat { border: 1px solid var(--rule); padding: var(--s3); margin-bottom: var(--s3); }
.bigstat .v { font-family: var(--mono); font-size: 30px; font-variant-numeric: tabular-nums;
  line-height: 1.1; margin: 3px 0 2px; }
.bigstat .band { font-family: var(--mono); font-size: 11px; color: var(--dim); }

.readout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); margin-top: var(--s3); }
.cell { background: var(--panel); padding: 9px 11px; }
.cell .v { font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums;
  margin-top: 1px; }
.cell.flag .v { color: var(--t5); }
.cell.good .v { color: var(--steel); }

.chip { display: inline-block; font-family: var(--mono); font-size: 9px;
  letter-spacing: .09em; text-transform: uppercase; padding: 1px 5px;
  border: 1px solid var(--rule); color: var(--dim); vertical-align: 1px; }
.chip.solid { border-color: var(--steel); color: var(--steel); }
.chip.hot { border-color: var(--t5); color: var(--t5); }

/* profile list, modelled on the joint table */
table.jt { width: 100%; border-collapse: collapse; }
table.jt th { text-align: left; padding: 0 0 8px; border-bottom: 1px solid var(--rule);
  vertical-align: bottom; }
table.jt td { padding: 9px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.jt td:nth-child(2) { padding-right: var(--s3); width: 100%; }
table.jt td:last-child { width: 56px; padding-left: var(--s2); }
table.jt tbody tr { cursor: pointer; }
table.jt tbody tr:hover td { background: var(--panel-2); }
table.jt tr[data-sel="true"] td { background: var(--panel-2); }
.swatch { width: 4px; height: 30px; display: block; border-radius: 1px; }
.jname { font-family: var(--mono); font-size: 11.5px; margin-bottom: 3px; }
.jmeta { font-size: 10px; color: var(--dim); font-family: var(--mono);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.jt .r { text-align: right; font-family: var(--mono); font-size: 12.5px;
  font-variant-numeric: tabular-nums; padding-left: var(--s2); white-space: nowrap; }
.spark { display: block; }

table.kv { width: 100%; border-collapse: collapse; font-size: 11.5px;
  margin-bottom: var(--s3); }
table.kv th { text-align: left; font-weight: 400; color: var(--dim);
  padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); }
table.kv td { text-align: right; font-family: var(--mono);
  font-variant-numeric: tabular-nums; padding: 4px 0; border-bottom: 1px solid var(--rule); }
table.kv td.l { text-align: left; }
table.kv td.win { color: var(--steel); }
table.kv td.pin { color: var(--t5); }
table.kv thead th { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
  text-transform: uppercase; }
table.kv th.r, table.kv thead th.r { text-align: right; }

.prow { padding: 9px 0; border-bottom: 1px solid var(--rule); }
.prow .top { display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; }
.prow .pn { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.prow .pv { font-family: var(--mono); font-size: 11.5px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.prow .pv .arrow, .prow .pv .x { color: var(--dimmer); }
.prow .pv .fit { color: var(--steel); }
.prow .pv .fit.pin { color: var(--t5); }
.prow .rmeta { display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 9px; color: var(--dimmer); margin-top: 1px; }

.rng { position: relative; height: 14px; width: 100%; min-width: 70px; }
.rng i { position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--rule); }
.rng u { position: absolute; top: 1px; width: 2px; height: 12px; background: var(--dimmer); }
.rng b { position: absolute; top: 1px; width: 2px; height: 12px; background: var(--steel); }
.rng b.pinned { background: var(--t5); width: 3px; }

.chart { width: 100%; display: block; }
.chart .gl { stroke: var(--rule); stroke-width: 1; }
.chart .ax { fill: var(--dim); font-family: var(--mono); font-size: 9px; }
code { font-family: var(--mono); font-size: 11px; color: var(--steel); word-break: break-word; }
.scroll { overflow-x: auto; }

@media (max-width: 940px) {
  .console { height: auto; }
  .split { grid-template-columns: 1fr; }
  .grip { display: none; }
  .controls { grid-template-columns: 1fr; }
  .verdictchip { justify-self: start; }
  .stage { height: 62vh; min-height: 340px; }
  .rail { border-left: 0; border-top: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="console">
  <div class="bar">
    <div class="ident">
      <h1>THERMAL WORLD MODEL &middot; REALITY GATE</h1>
      <p>Physics against learned, free-running on held-out PMSM thermocouple data</p>
    </div>
    <div class="controls">
      <div class="pick">
        <span class="lbl">Held-out profile</span>
        <select class="jsel" id="prof" aria-label="Held-out profile"></select>
      </div>
      <div class="pick">
        <span class="lbl">Node</span>
        <div class="seg" id="node" role="group" aria-label="Node"></div>
      </div>
      <div class="pick">
        <span class="lbl">Trace</span>
        <div class="seg" id="show" role="group" aria-label="Trace">
          <button type="button" data-k="lptn" aria-pressed="true">LPTN</button>
          <button type="button" data-k="tnn" aria-pressed="true">TNN</button>
          <button type="button" data-k="err" aria-pressed="false">Residual</button>
          <button type="button" data-k="drive" aria-pressed="true">Drive</button>
        </div>
      </div>
      <div class="verdictchip">
        <span class="lbl">Whole-profile MAE</span>
        <span class="v" id="chipL">&mdash;</span>
        <span class="lbl">vs</span>
        <span class="v" id="chipT">&mdash;</span>
      </div>
    </div>
  </div>

  <div class="split">
    <div class="stage" id="stage">
      <svg id="view" role="img" aria-label="Measured against predicted temperature"></svg>

      <div class="hud key" id="keyPanel">
        <span class="lbl" id="keyTitle">Winding temperature</span>
        <div id="keyRows"></div>
      </div>

      <div class="hud stat" id="statPanel">
        <span class="lbl">This profile</span>
        <dl id="statRows"></dl>
      </div>

      <div class="hud probe" id="probe" hidden></div>
    </div>

    <button class="grip" id="grip" aria-label="Resize panel" title="Drag to resize"></button>

    <div class="rail">
      <div class="rtabs" role="tablist">
        <button role="tab" aria-selected="true" data-pane="verdict">Verdict</button>
        <button role="tab" aria-selected="false" data-pane="profiles">Profiles</button>
        <button role="tab" aria-selected="false" data-pane="params">Params</button>
        <button role="tab" aria-selected="false" data-pane="gates">Gates</button>
        <button role="tab" aria-selected="false" data-pane="notes">Notes</button>
      </div>
      <div class="pane" data-open="true" id="pane-verdict"></div>
      <div class="pane" id="pane-profiles"></div>
      <div class="pane" id="pane-params"></div>
      <div class="pane" id="pane-gates"></div>
      <div class="pane" id="pane-notes"></div>
    </div>
  </div>
</div>

<script id="D" type="application/json">__DATA__</script>
<script>
(function () {
"use strict";

var DEG = "\u00b0C";
var D = JSON.parse(document.getElementById("D").textContent);
var NODES = ["winding", "yoke", "magnet"];
var LABEL = { winding: "Winding", yoke: "Yoke", magnet: "Magnet" };
var FULL = { winding: "Stator winding", yoke: "Stator yoke", magnet: "Magnet / rotor" };
var el = function (i) { return document.getElementById(i); };
var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };

var S = { pid: D.profiles[0].id, node: "winding",
          lptn: true, tnn: true, err: false, drive: true, cursor: null };

function P() {
  for (var i = 0; i < D.profiles.length; i++) if (D.profiles[i].id === S.pid) return D.profiles[i];
  return D.profiles[0];
}

/* the thermal ramp doubles as the severity ramp */
var RAMP = ["--t0", "--t1", "--t2", "--t3", "--t4", "--t5"];
function sev(mae) {
  return css(RAMP[Math.min(RAMP.length - 1, Math.max(0, Math.floor(mae / 1.6)))]);
}
function fmt(v) {
  if (v === 0) return "0";
  var a = Math.abs(v);
  if (a < 1e-3 || a >= 1e5) return v.toExponential(2);
  return String(+v.toPrecision(3));
}
function ticks(a, b, n) {
  var raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var st = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; })
    .filter(function (m) { return m >= raw; })[0] || 10 * mag;
  var out = [], v = Math.ceil(a / st) * st;
  for (; v <= b + 1e-9; v += st) out.push(v);
  return out;
}

/* ================= stage ================= */

var GEO = null;

function drawStage() {
  var stage = el("stage");
  var W = stage.clientWidth, H = stage.clientHeight;
  if (W < 40 || H < 40) return;

  var p = P(), n = S.node, xs = p.t;
  var series = [];
  if (S.err) {
    if (S.lptn) series.push({ k: "lptn", name: "LPTN residual", color: css("--steel"), w: 1.5,
      y: p.lptn[n].map(function (v, i) { return v - p.meas[n][i]; }) });
    if (S.tnn) series.push({ k: "tnn", name: "TNN residual", color: css("--t4"), w: 1.5, dash: "5 3",
      y: p.tnn[n].map(function (v, i) { return v - p.meas[n][i]; }) });
  } else {
    series.push({ k: "meas", name: "Measured", color: css("--ink"), y: p.meas[n], w: 2.1 });
    if (S.lptn) series.push({ k: "lptn", name: "LPTN", color: css("--steel"), y: p.lptn[n], w: 1.5 });
    if (S.tnn) series.push({ k: "tnn", name: "TNN", color: css("--t4"), y: p.tnn[n], w: 1.5, dash: "5 3" });
  }

  /* HUDs float over the stage, so reserve their height rather than let a
     trace disappear behind them */
  drawKey(series);
  drawStat();
  var hudH = Math.max(el("keyPanel").offsetHeight, el("statPanel").offsetHeight);
  var padL = 56, padR = 20, padB = 30;
  var padT = Math.min(H * 0.45, hudH + 30);
  var driveH = S.drive ? Math.max(50, Math.min(104, H * 0.2)) : 0;
  var gap = driveH ? 30 : 0;
  var mainH = H - padT - padB - driveH - gap;
  if (mainH < 70) { padT = Math.max(30, H - padB - driveH - gap - 70); mainH = 70; }
  var iw = W - padL - padR;

  var lo = Infinity, hi = -Infinity;
  series.forEach(function (s) { s.y.forEach(function (v) {
    if (v < lo) lo = v; if (v > hi) hi = v; }); });
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (S.err) { var m = Math.max(Math.abs(lo), Math.abs(hi)) || 1; lo = -m; hi = m; }
  var span = (hi - lo) || 1;
  lo -= span * 0.10; hi += span * 0.10;

  var xmax = xs[xs.length - 1] || 1;
  var X = function (v) { return padL + iw * v / xmax; };
  var Y = function (v) { return padT + mainH * (1 - (v - lo) / (hi - lo)); };

  var g = "";
  ticks(lo, hi, 5).forEach(function (v) {
    var y = Y(v), zero = S.err && Math.abs(v) < 1e-9;
    g += '<line class="gl" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + iw) +
      '" y2="' + y.toFixed(1) + '"' + (zero ? ' stroke="' + css("--dim") + '"' : "") + "/>" +
      '<text class="ax" x="' + (padL - 8) + '" y="' + (y + 3.4).toFixed(1) +
      '" text-anchor="end">' + (Math.abs(v) < 1e-9 ? "0" : v.toFixed(v % 1 ? 1 : 0)) + "</text>";
  });
  g += '<line class="gl" x1="' + padL + '" y1="' + (padT + mainH) + '" x2="' + (padL + iw) +
    '" y2="' + (padT + mainH) + '"/>';

  series.forEach(function (s) {
    var d = "", cnt = Math.min(xs.length, s.y.length);
    for (var i = 0; i < cnt; i++)
      d += (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(s.y[i]).toFixed(1) + " ";
    g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + s.w + '"' +
      (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") + ' stroke-linejoin="round"/>';
  });

  var dTop = padT + mainH + gap;
  var axisY = dTop + driveH;          /* bottom of whichever panel is last */
  if (!driveH) axisY = padT + mainH;
  ticks(0, xmax, 7).forEach(function (v) {
    g += '<text class="ax" x="' + X(v).toFixed(1) + '" y="' + (axisY + 16) +
      '" text-anchor="middle">' + v.toFixed(0) + "</text>";
  });
  g += '<text class="axl" x="' + (padL + iw) + '" y="' + (axisY + 16) +
    '" text-anchor="end">Minutes</text>';

  if (driveH) {
    var spd = p.inputs.speed, isq = p.inputs.i_sq;
    var smax = Math.max.apply(null, spd) || 1, imax = Math.max.apply(null, isq) || 1;
    g += '<line class="gl" x1="' + padL + '" y1="' + (dTop + driveH) + '" x2="' + (padL + iw) +
      '" y2="' + (dTop + driveH) + '"/>';
    [[spd, smax, css("--dimmer")], [isq, imax, css("--t5")]].forEach(function (r) {
      var d = "";
      for (var i = 0; i < xs.length; i++)
        d += (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " +
          (dTop + driveH * (1 - r[0][i] / r[1])).toFixed(1) + " ";
      g += '<path d="' + d + '" fill="none" stroke="' + r[2] +
        '" stroke-width="1.1" opacity=".85"/>';
    });
    g += '<text class="axl" x="' + padL + '" y="' + (dTop - 9) +
      '">Drive &#183; speed &#183; current squared</text>';
  }

  if (S.cursor != null && S.cursor >= 0 && S.cursor < xs.length) {
    var cx = X(xs[S.cursor]);
    g += '<line class="cur" x1="' + cx.toFixed(1) + '" y1="' + padT + '" x2="' +
      cx.toFixed(1) + '" y2="' + (dTop + driveH) + '"/>';
    series.forEach(function (s) {
      g += '<circle cx="' + cx.toFixed(1) + '" cy="' + Y(s.y[S.cursor]).toFixed(1) +
        '" r="2.6" fill="' + s.color + '"/>';
    });
  }

  var v = el("view");
  v.setAttribute("viewBox", "0 0 " + W + " " + H);
  v.innerHTML = g;

  GEO = { padL: padL, iw: iw, xmax: xmax };
  drawKey(series);
  drawStat();
}

function drawKey(series) {
  var p = P(), n = S.node;
  el("keyTitle").textContent = FULL[n] + (S.err ? " residual, K" : " temperature, " + DEG);
  var rows = series.map(function (s) {
    var tail = s.k === "lptn" ? p.mae.lptn[n].toFixed(2) + " K"
             : s.k === "tnn" ? p.mae.tnn[n].toFixed(2) + " K" : "thermocouple";
    return '<div class="keyrow"><i style="border-top-color:' + s.color +
      (s.dash ? ";border-top-style:dashed" : "") + '"></i><span>' + esc(s.name) +
      "</span><span>" + tail + "</span></div>";
  });
  if (S.drive) {
    rows.push('<div class="keyrow" style="margin-top:9px;padding-top:7px;' +
      'border-top:1px solid var(--rule)"><i style="border-top-color:' + css("--dimmer") +
      '"></i><span>Speed</span><span>' + Math.max.apply(null, p.inputs.speed) +
      " rpm pk</span></div>");
    rows.push('<div class="keyrow"><i style="border-top-color:' + css("--t5") +
      '"></i><span>Current squared</span><span>' + Math.max.apply(null, p.inputs.i_sq) +
      " A&#178; pk</span></div>");
  }
  el("keyRows").innerHTML = rows.join("");
}

function drawStat() {
  var p = P(), n = S.node, L = p.mae.lptn[n], T = p.mae.tnn[n];
  var hot = function (v) { return v > 15 ? ' style="color:var(--t4)"' : ""; };
  el("statRows").innerHTML =
    "<dt>Profile</dt><dd>#" + p.id + "</dd>" +
    "<dt>Duration</dt><dd>" + p.minutes.toFixed(0) + " min</dd>" +
    "<dt>LPTN max</dt><dd" + hot(p.max.lptn[n]) + ">" + p.max.lptn[n].toFixed(1) + " K</dd>" +
    "<dt>TNN max</dt><dd" + hot(p.max.tnn[n]) + ">" + p.max.tnn[n].toFixed(1) + " K</dd>" +
    "<dt>Closer</dt><dd>" + (L < T ? "LPTN" : T < L ? "TNN" : "tie") + "</dd>";
}

(function probeSetup() {
  var stage = el("stage"), pb = el("probe");
  function hide() { pb.hidden = true; if (S.cursor != null) { S.cursor = null; drawStage(); } }
  stage.addEventListener("pointermove", function (e) {
    if (!GEO) return;
    var r = stage.getBoundingClientRect(), x = e.clientX - r.left, p = P();
    var frac = (x - GEO.padL) / GEO.iw;
    if (frac < -0.02 || frac > 1.02) { hide(); return; }
    var tv = Math.max(0, Math.min(GEO.xmax, frac * GEO.xmax));
    var i = 0, best = Infinity;
    for (var k = 0; k < p.t.length; k++) {
      var dd = Math.abs(p.t[k] - tv);
      if (dd < best) { best = dd; i = k; }
    }
    S.cursor = i;
    drawStage();
    var n = S.node;
    pb.innerHTML = '<div class="pn">' + p.t[i].toFixed(1) + " min &#183; profile " + p.id +
      "</div><dl><dt>Measured</dt><dd>" + p.meas[n][i].toFixed(1) + " " + DEG + "</dd>" +
      (S.lptn ? "<dt>LPTN</dt><dd>" + p.lptn[n][i].toFixed(1) + " " + DEG + "</dd>" +
        '<dt style="color:var(--steel)">error</dt><dd style="color:var(--steel)">' +
        (p.lptn[n][i] - p.meas[n][i]).toFixed(1) + " K</dd>" : "") +
      (S.tnn ? "<dt>TNN</dt><dd>" + p.tnn[n][i].toFixed(1) + " " + DEG + "</dd>" +
        '<dt style="color:var(--t4)">error</dt><dd style="color:var(--t4)">' +
        (p.tnn[n][i] - p.meas[n][i]).toFixed(1) + " K</dd>" : "") +
      "<dt>Speed</dt><dd>" + p.inputs.speed[i] + " rpm</dd>" +
      "<dt>Coolant</dt><dd>" + p.inputs.coolant[i].toFixed(1) + " " + DEG + "</dd></dl>";
    pb.hidden = false;
    var lx = x + 16, ly = e.clientY - r.top + 14;
    if (lx + pb.offsetWidth > r.width - 8) lx = x - pb.offsetWidth - 16;
    if (ly + pb.offsetHeight > r.height - 8) ly = r.height - pb.offsetHeight - 8;
    pb.style.left = Math.max(8, lx) + "px";
    pb.style.top = Math.max(8, ly) + "px";
  });
  stage.addEventListener("pointerleave", hide);
})();

/* ================= rail helpers ================= */

function miniChart(opts) {
  var W = 340, H = opts.height || 150;
  var pad = { l: 34, r: 8, t: 10, b: 20 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var lo = Infinity, hi = -Infinity;
  opts.series.forEach(function (s) { s.y.forEach(function (v) {
    if (v < lo) lo = v; if (v > hi) hi = v; }); });
  lo = Math.min(lo, 0); hi += (hi - lo) * 0.12 || 1;
  var xmax = opts.x[opts.x.length - 1] || 1;
  var X = function (v) { return pad.l + iw * v / xmax; };
  var Y = function (v) { return pad.t + ih * (1 - (v - lo) / (hi - lo)); };
  var g = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc(opts.label) + '">';
  ticks(lo, hi, 4).forEach(function (v) {
    g += '<line class="gl" x1="' + pad.l + '" y1="' + Y(v).toFixed(1) + '" x2="' + (pad.l + iw) +
      '" y2="' + Y(v).toFixed(1) + '"/><text class="ax" x="' + (pad.l - 5) + '" y="' +
      (Y(v) + 3).toFixed(1) + '" text-anchor="end">' +
      (v % 1 ? v.toFixed(1) : v.toFixed(0)) + "</text>";
  });
  opts.x.forEach(function (v, i) {
    if (opts.xlabels) g += '<text class="ax" x="' + X(v).toFixed(1) + '" y="' + (H - 6) +
      '" text-anchor="middle">' + esc(opts.xlabels[i]) + "</text>";
  });
  opts.series.forEach(function (s) {
    var d = "";
    for (var i = 0; i < opts.x.length; i++)
      d += (i ? "L" : "M") + X(opts.x[i]).toFixed(1) + " " + Y(s.y[i]).toFixed(1) + " ";
    g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="1.8"' +
      (s.dash ? ' stroke-dasharray="5 3"' : "") + "/>";
    for (var j = 0; j < opts.x.length; j++)
      g += '<circle cx="' + X(opts.x[j]).toFixed(1) + '" cy="' + Y(s.y[j]).toFixed(1) +
        '" r="2.4" fill="' + s.color + '"/>';
  });
  return g + "</svg>";
}

function spark(vals, color) {
  var W = 54, H = 20;
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var sp = (hi - lo) || 1, step = Math.max(1, Math.floor(vals.length / 40)), d = "";
  for (var i = 0, k = 0; i < vals.length; i += step, k++)
    d += (k ? "L" : "M") + (W * i / (vals.length - 1)).toFixed(1) + " " +
      (H - 1 - (H - 2) * (vals[i] - lo) / sp).toFixed(1) + " ";
  return '<svg class="spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H +
    '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + color +
    '" stroke-width="1.2"/></svg>';
}

function paneVerdict() {
  var a = D.aggregate_whole_profile;

  var lw = L < T, gap = Math.abs(L - T) / Math.max(L, T) * 100;
  var ratio = Math.round(D.tnn_learned.n_params / D.params.length);
  var hours = (D.profiles.reduce(function (s, p) { return s + p.minutes; }, 0) / 60).toFixed(1);

  var h = '<div class="head"><h2>Free-running on held-out data</h2><span class="sub">' +
    D.meta.n_test + " profiles, " + hours +
    " h, no measurement fed back after t = 0</span></div>";

  h += '<div class="bigstat"><span class="lbl">' + ratio +
    "&#215; more parameters bought</span>" +
    '<div class="v" style="color:' + (lw ? css("--steel") : css("--t3")) + '">' +
    (lw ? "nothing" : gap.toFixed(0) + "%") + '</div><span class="band">LPTN ' +
    L.toFixed(2) + " K &#183; TNN " + T.toFixed(2) + " K</span></div>";

  h += '<div class="note ' + (lw ? "key" : "warn") + '">Over whole profiles the fitted ' +
    "physics model is <b>" + (lw ? "ahead by " : "behind by ") + gap.toFixed(0) +
    "%</b>. The network wins the winding (" + a.tnn.winding.mae.toFixed(2) + " vs " +
    a.lptn.winding.mae.toFixed(2) + " K) and long horizons, which is what it was trained " +
    "for, and loses both slower nodes and the worst case.</div>";

  h += '<div class="readout"><div class="cell good"><span class="lbl">LPTN params</span>' +
    '<div class="v">' + D.params.length + "</div></div>" +
    '<div class="cell"><span class="lbl">TNN params</span><div class="v">' +
    D.tnn_learned.n_params.toLocaleString() + "</div></div></div>";

  h += '<h3 class="sec">Both models, same data</h3><table class="kv"><thead><tr>' +
    '<th>Node</th><th class="r">LPTN</th><th class="r">TNN</th>' +
    '<th class="r">L max</th><th class="r">T max</th></tr></thead><tbody>';
  NODES.concat(["ALL"]).forEach(function (n) {
    var l = a.lptn[n], t = a.tnn[n];
    h += "<tr><th>" + (n === "ALL" ? "All nodes" : FULL[n]) + "</th>" +
      '<td class="' + (l.mae <= t.mae ? "win" : "") + '">' + l.mae.toFixed(2) + "</td>" +
      '<td class="' + (t.mae < l.mae ? "win" : "") + '">' + t.mae.toFixed(2) + "</td>" +
      "<td>" + l.max.toFixed(1) + "</td><td>" + t.max.toFixed(1) + "</td></tr>";
  });
  h += "</tbody></table><p>Kelvin, whole-profile free run. Max matters more than mean on " +
    "the magnet: NdFeB demagnetisation is irreversible, so a " + a.tnn.magnet.max.toFixed(0) +
    " K excursion is not averaged away by a good mean.</p>";

  var hs = ["1", "10", "100", "700"], dt = D.meta.dt_s;
  h += '<h3 class="sec">Error against horizon</h3>' + miniChart({
    x: hs.map(function (k) { return +k * dt / 60; }),
    height: 158, label: "error against rollout horizon",
    xlabels: hs.map(function (k) {
      var m = +k * dt / 60;
      return m < 1 ? (m * 60).toFixed(0) + "s" : m.toFixed(0) + "m";
    }),
    series: [
      { y: hs.map(function (k) { return D.horizon.lptn[k].ALL; }), color: css("--steel") },
      { y: hs.map(function (k) { return D.horizon.tnn[k].ALL; }), color: css("--t4"), dash: 1 }
    ]
  });
  h += '<div class="keyrow" style="margin-top:6px"><i style="border-top-color:' + css("--steel") +
    '"></i><span>LPTN &#183; error grows</span></div>' +
    '<div class="keyrow"><i style="border-top-color:' + css("--t4") +
    ';border-top-style:dashed"></i><span>TNN &#183; error flattens</span></div>' +
    '<p style="margin-top:var(--s3)">Drift is the failure mode that matters in a rollout ' +
    "model. Training used multi-step rollouts with an explicit drift penalty rather than " +
    "single-step loss, which on 2 Hz thermal data is trivially easy and hides exactly " +
    "this.</p>";
  el("pane-verdict").innerHTML = h;
}

function paneParams() {
  var pinned = D.params.filter(function (p) { return p.pinned; });
  var h = '<div class="head"><h2>Identified parameters</h2><span class="sub">' +
    D.params.length + " fitted, bounded by physically plausible ranges</span></div>";

  h += '<div class="readout" style="margin-top:0"><div class="cell"><span class="lbl">Fitted' +
    '</span><div class="v">' + D.params.length + "</div></div>" +
    '<div class="cell ' + (pinned.length ? "flag" : "good") +
    '"><span class="lbl">Pinned at bound</span><div class="v">' + pinned.length +
    "</div></div></div>";

  h += '<h3 class="sec">Prior &#8594; fitted, and where it landed</h3>';
  D.params.forEach(function (p) {
    h += '<div class="prow"><div class="top"><span class="pn">' +
      esc(p.name.replace(/^(resistances|losses|materials|mechanical)\./, "")) +
      (p.pinned ? ' <span class="chip hot">pin</span>' : "") + '</span>' +
      '<span class="pv">' + fmt(p.prior) + ' <span class="arrow">&#8594;</span> ' +
      '<span class="fit ' + (p.pinned ? "pin" : "") + '">' + fmt(p.fitted) + "</span>" +
      (p.ratio == null ? "" : ' <span class="x">' + p.ratio + "&#215;</span>") +
      "</span></div>";
    if (p.lo != null && p.hi != null) {
      var f = function (v) {
        var a = Math.log(Math.max(p.lo, 1e-12)), b = Math.log(Math.max(p.hi, 1e-12));
        return Math.max(0, Math.min(100, 100 * (Math.log(Math.max(v, 1e-12)) - a) / (b - a)));
      };
      h += '<div class="rng" title="plausible range ' + p.lo + " to " + p.hi + '"><i></i>' +
        '<u style="left:' + f(p.prior) + '%"></u><b class="' + (p.pinned ? "pinned" : "") +
        '" style="left:' + f(p.fitted) + '%"></b></div>' +
        '<div class="rmeta"><span>' + fmt(p.lo) + "</span><span>plausible range</span><span>" +
        fmt(p.hi) + "</span></div>";
    }
    h += "</div>";
  });
  h += '<div class="keyrow" style="margin-top:var(--s3)">' +
    '<i style="border-top-color:var(--dimmer)"></i><span>prior</span></div>' +
    '<div class="keyrow"><i style="border-top-color:var(--steel)"></i>' +
    "<span>fitted</span></div>" +
    '<div class="keyrow"><i style="border-top-color:var(--t5)"></i>' +
    "<span>fitted, pinned at a bound</span></div>";

  h += '<div class="note bad"><b>' + pinned.length + " parameters hit their bounds.</b> A " +
    "parameter that had to reach its limit to fit the data means the model <b>structure</b> " +
    "is wrong, not the parameter. All " + pinned.length + " point the same way: the model " +
    "cannot generate enough speed-driven loss. Iron hysteresis and bearing friction pinned " +
    "high, phase resistance pushed 2.3&#215; down, magnet eddy up 5&#215;, AC-copper moved " +
    "off zero.</div>" +
    '<div class="note warn">Most likely single cause: <code>pole_pairs</code> is ' +
    "<b>unsourced</b> &#8212; not published with the dataset. Electrical frequency enters " +
    "the eddy term quadratically, so one wrong integer would produce exactly this " +
    "signature. It is also the cheapest thing to fix.</div>";

  h += '<h3 class="sec">Held fixed, deliberately</h3><p>All four capacitances (from ' +
    "<code>m&#183;c_p</code>), the copper temperature coefficient, and every published " +
    "material property. Fitting a knowable constant to improve a residual destroys the only " +
    "ground truth a model has. <code>src/params.py</code> raises if a parameter is both " +
    "knowable and marked fittable &#8212; which caught one of my own mistakes.</p>";

  h += '<h3 class="sec">What the network learned</h3><p>The network keeps the thermal ' +
    "network's structure, so everything it learned is a conductance or capacitance in real " +
    "units and can be put beside the physics model's values. A black box offers no such " +
    "check.</p>";
  h += '<table class="kv"><thead><tr><th>Quantity</th><th class="r">LPTN</th>' +
    '<th class="r">TNN</th><th class="r">&#215;</th></tr></thead><tbody>';
  ["winding", "yoke", "magnet", "housing"].forEach(function (nm, i) {
    var a = D.lptn_capacitances[i], b = D.tnn_learned.capacitances[i];
    h += "<tr><th>C " + nm + "</th><td>" + a + "</td><td>" + b +
      '</td><td style="color:var(--dim)">' + (b / a).toFixed(2) + "</td></tr>";
  });
  var lp = {};
  D.params.forEach(function (p) { lp[p.name] = p.fitted; });
  Object.keys(D.tnn_learned.resistances).forEach(function (k) {
    var a = lp["resistances." + k], b = D.tnn_learned.resistances[k];
    if (a == null) return;
    h += "<tr><th>R " + esc(k.replace(/_/g, " ")) + "</th><td>" + fmt(a) + "</td><td>" +
      fmt(b) + '</td><td style="color:var(--dim)">' + (b / a).toFixed(2) + "</td></tr>";
  });
  var rp = lp["losses.copper.phase_resistance_20C"];
  h += "<tr><th>R phase</th><td>" + fmt(rp) + "</td><td>" + fmt(D.tnn_learned.r_phase) +
    '</td><td style="color:var(--dim)">' + (D.tnn_learned.r_phase / rp).toFixed(2) +
    "</td></tr></tbody></table>";
  h += '<div class="note">The two disagree most on the housing capacitance &#8212; the one ' +
    "node that is <b>never measured</b>. It is a latent state, seeded from the coolant, and " +
    "its identified value should be trusted least.</div>";
  el("pane-params").innerHTML = h;
}

function paneGates() {
  var h = '<div class="head"><h2>Gates</h2>' +
    '<span class="sub">Only the third one could have failed</span></div>';
  var rows = [
    ["Analytical", "Isolated node, constant power, against the closed form " +
      "&#916;T = P&#183;R(1 &#8722; e<sup>&#8722;t/RC</sup>).",
      "8.9e-15 K", "steady-state rise"],
    ["Physics", "First and second law, conductance symmetry, boundedness, monotonicity in " +
      "current and coolant flow, thermal runaway by eigenvalue rather than by waiting for a " +
      "blow-up &#8212; 17 of 17 checks.", "9.1e-12 W", "instantaneous balance"],
    ["Reality", "Held-out measured profiles, free-running, no measurement fed back after " +
      "t = 0.", D.aggregate_whole_profile.lptn.ALL.mae.toFixed(2) + " K",
      "LPTN whole-profile MAE"],
    ["Energy, TNN", "Structural rather than tested &#8212; conduction is written as an " +
      "antisymmetric exchange, so whatever leaves one node arrives at the other exactly.",
      "0.0 W", "residual at initialisation"]
  ];
  rows.forEach(function (r) {
    h += '<h3 class="sec">' + r[0] + ' <span class="chip solid">pass</span></h3><p>' + r[1] +
      '</p><div class="readout" style="margin-top:0"><div class="cell good">' +
      '<span class="lbl">' + r[3] + '</span><div class="v">' + r[2] + "</div></div>" +
      '<div class="cell"><span class="lbl">Verdict</span><div class="v">PASS</div></div></div>';
  });
  h += '<div class="note key" style="margin-top:var(--s5)">Only the reality gate can ' +
    "falsify the physics. The other two confirm the code is self-consistent &#8212; " +
    "necessary, but they would pass just as happily on a model that describes no real " +
    "motor.</div>" +
    '<div class="note">Getting gate 1 exact required a correction worth recording: the ' +
    "lossless floating subnetwork settles <i>at</i> the housing temperature, so its links " +
    "carry zero steady current and must not enter the effective resistance. Including them " +
    "was wrong by 2.45e-8 K.</div>" +
    '<div class="note">Also verified: a <b>negative resistance is rejected</b>, not silently ' +
    "accepted. An optimiser will propose one if it lowers the residual, and it would " +
    "transport heat up a gradient.</div>";
  el("pane-gates").innerHTML = h;
}

function paneNotes() {
  var a = D.aggregate_whole_profile;
  var h = '<div class="head"><h2>What this cannot do</h2>' +
    '<span class="sub">In order of how much it affects the result</span></div><ul>' +
    "<li><b>3 K mean is not a safety margin.</b> Peak errors reach " +
      a.lptn.ALL.max.toFixed(0) + " K (LPTN) and " + a.tnn.ALL.max.toFixed(0) +
      " K (TNN) on the magnet.</li>" +
    "<li><b>Pole-pair count is unsourced.</b> The cheapest thing to fix, and the likely " +
      "cause of all four pinned parameters.</li>" +
    "<li><b>The housing is never measured.</b> A latent state seeded from the coolant; its " +
      "identified capacitance is the least trustworthy number here.</li>" +
    "<li><b>The stator tooth is measured but not modelled.</b> A four-node network lumps it " +
      "into the yoke, and the tooth runs much hotter.</li>" +
    "<li><b>Coolant flow rate is not in the dataset.</b> The flow-dependent resistance law " +
      "is implemented and unit-tested but never exercised against data, so any claim about " +
      "pump degradation is untested.</li>" +
    "<li><b>Geometry is assumed</b>, not taken from drawings, which are not published.</li>" +
    "<li><b>One machine.</b> Nothing here demonstrates transfer &#8212; and transfer is the " +
      "whole claim of a world model.</li></ul>";

  h += '<h3 class="sec">Integrity of the evaluation</h3><ul>' +
    "<li>Priors were rescaled using the <b>fit split only</b>, never the held-out profiles.</li>" +
    "<li>Validation profiles came out of the fit split, not the test split.</li>" +
    "<li>RK4 at dt = " + D.meta.dt_s + " s verified against the exact matrix exponential: " +
      "max 5.3e-5 K over 400 steps.</li>" +
    "<li>The vectorised system assembly is bit-identical to the per-step version.</li></ul>";

  h += '<h3 class="sec">Data</h3><table class="kv"><tbody>' +
    '<tr><th>Source</th><td class="l">Paderborn LEA</td></tr>' +
    "<tr><th>Samples</th><td>1,330,816</td></tr>" +
    "<tr><th>Rate</th><td>2 Hz</td></tr>" +
    "<tr><th>Profiles</th><td>" + D.meta.n_profiles_total + "</td></tr>" +
    "<tr><th>Total</th><td>" + D.meta.hours_total + " h</td></tr>" +
    "<tr><th>Fit / held out</th><td>" + D.meta.n_fit + " / " + D.meta.n_test + "</td></tr>" +
    "<tr><th>Rollout step</th><td>" + D.meta.dt_s + " s</td></tr></tbody></table>";
  h += "<p>Licence CC-BY-SA-4.0. Model structure after Wallscheid &amp; B&#246;cker (2016); " +
    "the learned variant after Kirchg&#228;ssner, Wallscheid &amp; B&#246;cker, " +
    "<i>Thermal Neural Networks</i> (arXiv:2103.16323). Nothing here has been validated on " +
    "a second machine.</p>";
  el("pane-notes").innerHTML = h;
}

function redrawRail() {
  paneVerdict(); paneProfiles(); paneParams(); paneGates(); paneNotes();
}

/* ================= controls ================= */

var sel = el("prof");
sel.innerHTML = D.profiles.map(function (p) {
  return '<option value="' + p.id + '">Profile ' + p.id + " &#183; " +
    p.minutes.toFixed(0) + " min</option>";
}).join("");
sel.value = S.pid;
sel.addEventListener("change", function () {
  S.pid = +this.value; drawStage(); paneProfiles();
});

el("node").innerHTML = NODES.map(function (n) {
  return '<button type="button" data-n="' + n + '" aria-pressed="' + (n === S.node) + '">' +
    LABEL[n] + "</button>";
}).join("");
el("node").querySelectorAll("button").forEach(function (b) {
  b.addEventListener("click", function () {
    S.node = b.dataset.n;
    el("node").querySelectorAll("button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b);
    });
    drawStage(); paneProfiles();
  });
});

el("show").querySelectorAll("button").forEach(function (b) {
  b.addEventListener("click", function () {
    var k = b.dataset.k;
    /* never let both model traces be hidden at once */
    if ((k === "lptn" || k === "tnn") && S[k] && !(S.lptn && S.tnn)) return;
    S[k] = !S[k];
    b.setAttribute("aria-pressed", S[k]);
    drawStage();
  });
});

document.querySelectorAll(".rtabs button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll(".rtabs button").forEach(function (x) {
      x.setAttribute("aria-selected", x === b);
    });
    document.querySelectorAll(".pane").forEach(function (p) {
      p.setAttribute("data-open", p.id === "pane-" + b.dataset.pane);
    });
  });
});

(function gripSetup() {
  var grip = el("grip"), split = document.querySelector(".split"), dragging = false;
  function set(px) {
    var min = 300, max = Math.max(min, Math.min(760, split.clientWidth - 340));
    document.documentElement.style.setProperty("--rail",
      Math.max(min, Math.min(max, px)) + "px");
    drawStage();
  }
  grip.addEventListener("pointerdown", function (e) {
    dragging = true;
    grip.setPointerCapture(e.pointerId);
    grip.dataset.drag = "true";
    document.body.dataset.resizing = "true";
    e.preventDefault();
  });
  grip.addEventListener("pointermove", function (e) {
    if (dragging) set(split.getBoundingClientRect().right - e.clientX);
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    grip.addEventListener(ev, function () {
      dragging = false;
      grip.dataset.drag = "false";
      document.body.dataset.resizing = "false";
    });
  });
  grip.addEventListener("keydown", function (e) {
    var cur = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--rail"), 10) || 400;
    if (e.key === "ArrowLeft") { set(cur + 24); e.preventDefault(); }
    if (e.key === "ArrowRight") { set(cur - 24); e.preventDefault(); }
  });
})();

el("chipL").textContent = D.aggregate_whole_profile.lptn.ALL.mae.toFixed(2) + " K";
el("chipT").textContent = D.aggregate_whole_profile.tnn.ALL.mae.toFixed(2) + " K";
el("chipL").style.color = css("--steel");
el("chipT").style.color = css("--t4");

redrawRail();
drawStage();
if (window.ResizeObserver) new ResizeObserver(function () { drawStage(); }).observe(el("stage"));
addEventListener("resize", drawStage);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
  redrawRail(); drawStage();
});
new MutationObserver(function () { redrawRail(); drawStage(); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
